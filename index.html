  <script>
    // Day or night colours before the first paint. The town opens where the last visit
    // left off (src/ui/clock.js saves daySeconds under this key), at the time a test link
    // gives, or on a first visit at data/town.js `start` (09:00). 0.625 real seconds make
    // a town minute; the night skin is on while the sun is below half light.
    (function () {
      var root = document.documentElement, minute = 540;
      try {
        var q = new URLSearchParams(location.search);
        if (q.has('minute') || q.has('day')) minute = Number(q.get('minute') || 540) || 0;
        else {
          var saved = Number(localStorage.getItem('yans-town:clock'));
          if (saved > 0) minute = (saved / 0.625) % 1440;
        }
      } catch (e) { /* storage blocked: day */ }
      var night = minute < 375 || minute >= 1140;
      root.dataset.sky = night ? 'night' : 'day';
      document.querySelector('meta[name="theme-color"]').content = night ? '#0b141e' : '#dce7ee';
    })();
  </script>

  </script>

              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <p class="welcome-hint">
          <span class="for-mouse">拖曳移動・滾輪縮放・右鍵旋轉，點建築看看裡面有誰</span>
          <span class="for-touch">單指移動・雙指縮放旋轉，點建築看看裡面有誰</span>
        </p>
      </div>
    </section>
  </div>

  <noscript><p class="noscript">彥彥的小鎮需要開啟 JavaScript 才能看到。</p></noscript>

  <script>
    // The town's code starts after the welcome card has painted, so the card and its
    // little town are on screen at once (a timeout inside rAF runs after that frame).
    (function () {
      function load() {
        var s = document.createElement('script');
        s.type = 'module';
        s.src = './src/main.js';
        document.body.appendChild(s);
      }
      if (document.visibilityState === 'hidden') load();
      else requestAnimationFrame(function () { setTimeout(load, 0); });
    })();
  </script>
</body>
